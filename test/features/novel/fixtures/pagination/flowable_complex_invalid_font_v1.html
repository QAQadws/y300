<strong><strong><font face="&amp;quot">喜歡的人和義妹</font></strong></strong><br />
<strong><font face="&amp;quot">第一話（１）</font></strong><div align="left">　　</div><div align="left">　　如果能轉世重生的話，我想成為像她那樣的人。</div><div align="left">　　</div><div align="left">　　烏黑亮麗的頭髮，與明顯雙眼皮的漂亮眼眸。明明身高應該沒有差多少，卻感覺比我的腿長上一倍的雙腿。</div>
