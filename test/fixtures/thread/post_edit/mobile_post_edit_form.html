<!doctype html>
<html lang="zh-CN">
<head>

<body id="forum" class="pg_post">

  <form method="post" id="postform"
        action="forum.php?mod=post&amp;action=edit&amp;extra=&amp;editsubmit=yes&amp;mobile=2"
        enctype="multipart/form-data">
    <input type="hidden" name="formhash" id="formhash" value="fixture-formhash">
    <input type="hidden" name="posttime" id="posttime" value="1700000000">
    <input type="hidden" name="fid" id="fid" value="5">
    <input type="hidden" name="tid" value="557857">
    <input type="hidden" name="pid" value="41587383">
    <input type="hidden" name="page" value="215">

    <div class="header cl">
      <div class="mz"><a href="javascript:history.back();">返回</a></div>
      <h2>编辑</h2>
    </div>

    <div class="post_from post_box">
      <input type="text" id="needsubject" value="" name="subject">
      <textarea id="needmessage" name="message">fixture 第一行
[b]fixture 加粗[/b]
[attachimg]1624572[/attachimg]</textarea>

      <div class="mimg cl">
        <input type="file" name="Filedata" id="filedata" multiple accept="image/jpeg,image/png">
        <input type="file" name="Filedata" id="attfiledata" multiple>
      </div>

      <ul id="imglist" class="post_imglist cl">
        <li>
          <span aid="1624572" class="del" up="1"><a href="javascript:;">删除</a></span>
          <span class="p_img"><img id="aimg_1624572" src="data/attachment/forum/fixture/existing-image.jpg" alt="fixture-image.jpg"></span>

      <ul id="attlist" class="post_attlist setbox cl"></ul>

        <label><input type="checkbox" name="smileyoff" value="1">禁用表情</label>
        <label><input type="checkbox" name="bbcodeoff" value="1">禁用编辑器代码</label>
        <label><input type="checkbox" name="imgcontent" value="0" disabled>内容生成图片</label>

    <div class="post_btn">
